services:
  llm:
    build:
      context: .
      dockerfile: llm.Dockerfile
    environment:
      LLAMA_THREADS: "4"
    ports:
      - "8000:8000"

  supabase:
    image: supabase/cli:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["supabase", "start"]

  web:
    image: node:20-alpine
    working_dir: /workspace
    depends_on:
      - supabase
      - llm
    env_file:
      - .env.local
    environment:
      LLM_URL: http://llm:8000
    volumes:
      - .:/workspace
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm dev"]
    ports:
      - "3000:3000"

  workers:
    image: node:20-alpine
    working_dir: /workspace
    depends_on:
      - supabase
      - llm
    env_file:
      - .env.local
    environment:
      LLM_URL: http://llm:8000
    volumes:
      - .:/workspace
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm dev:workers"]

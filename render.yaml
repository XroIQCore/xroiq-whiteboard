services:
  - type: web
    name: xroiq-whiteboard-web
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: LLM_URL
        value: https://llm.xroiq-tunnel.trycloudflare.com
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: worker
    name: xroiq-whiteboard-workers
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate
    startCommand: pnpm run workers:core
    envVars:
      - key: LLM_URL
        value: https://llm.xroiq-tunnel.trycloudflare.com
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

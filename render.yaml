services:
  - type: pserv
    name: llm
    env: docker
    dockerfilePath: ./llm.Dockerfile
    plan: free
    envVars:
      - key: LLAMA_THREADS
        value: "4"

  - type: web
    name: xroiq-whiteboard-web
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: LLM_URL
        value: http://llm:8000
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: worker
    name: xroiq-whiteboard-workers
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate
    startCommand: pnpm dev:workers
    envVars:
      - key: LLM_URL
        value: http://llm:8000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
